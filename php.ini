; php.ini - project-local PHP configuration for the MIS-System.
; PHP does not automatically load this project file. Start the server with:
; php -c "C:\MIS-System\php.ini" -S localhost:8000

extension_dir = "H:\Computer Language\php dl\ext"
;extension_dir = "C:\Users\Adrian\php\ext"


; Database drivers required by config/db_connection.php
extension=php_pdo_sqlite.dll
extension=php_pdo_mysql.dll
extension=php_mysqli.dll
extension=php_pdo_odbc.dll

; Sessions (used by the login system)
session.gc_maxlifetime = 28800
session.cookie_httponly = 1
session.use_strict_mode = 1

; Uploads / posts
upload_max_filesize = 10M
post_max_size = 10M

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

date.timezone = "Asia/Manila"
