; php.ini - project-local PHP configuration for the MIS-System.
; php.exe automatically loads php.ini from the directory it is invoked in,
; so `php -S localhost:8080` run from the project root uses these settings.

extension_dir = "C:\Users\adrian\php\ext"

; Database drivers required by config/db_connection.php
extension=php_pdo_sqlite.dll
extension=php_pdo_mysql.dll
extension=php_mysqli.dll

; Sessions (used by the login system)
session.save_path = "C:\Users\adrian\AppData\Local\hermes\cache\scratch\php_sessions"
session.gc_maxlifetime = 28800
session.cookie_httponly = 1
session.use_strict_mode = 1

; Uploads / posts
upload_max_filesize = 10M
post_max_size = 10M

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = "C:\Users\adrian\AppData\Local\hermes\cache\scratch\php_errors.log"

date.timezone = "Asia/Manila"
